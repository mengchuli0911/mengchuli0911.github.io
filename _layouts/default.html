<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
<a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
<nav aria-label="Main navigation">
{% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
<button id="theme" type="button" aria-label="Color theme: system">◐ <span>System</span></button>
</nav></header>
<main id="main">{{ content }}</main>
<footer><div class="footer-inner">© {{ 'now' | date: '%Y' }} {{ site.data.profile.name }}</div></footer>
</body></html>
